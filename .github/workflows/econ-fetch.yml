name: Economic calendar fetch

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 minutes (GitHub may run a few minutes late)
  workflow_dispatch:           # "Run workflow" button for a manual refresh

concurrency:
  group: econ-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch TradingView → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/fetch_econ.py
